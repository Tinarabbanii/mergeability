seed: 0

# Which subset sizes to merge and evaluate.
#   2       -> the pairwise study (RQ1)
#   3, 4    -> the k-way study (RQ2)
k_values: [2, 3, 4]

# Cap on subsets per k, read by pipeline.enumerate_subsets. With 8 tasks:
# 28 pairs, 56 triples, 70 quads. 100 leaves every k exhaustive. RE-CHECK THIS
# WHENEVER THE TASK COUNT CHANGES -- at 40 it silently capped k=3 and k=4.
max_subsets_per_k: 100

# Real-data evaluation only: subsample each test set for speed.
eval_samples_per_task: 1000

# Every key below matches a parameter in predict.py.
predictor:
  solver: lasso         # 'lasso'   coordinate descent, deterministic, ~1000x
                        #           faster. Gives the same DIRECTION as
                        #           maximising Pearson, because for a linear
                        #           model with intercept the least-squares
                        #           direction IS the correlation-maximising one.
                        # 'pearson' the literal gradient maximiser, kept as a
                        #           fidelity check. Very slow.
  l1_lambda: 0.01       # fallback only; used when lambda_grid is absent
  lambda_grid: [0.0001, 0.000178, 0.000316, 0.000562, 0.001, 0.00178, 0.00316,
                0.00562, 0.01, 0.0178, 0.0316, 0.0562, 0.1]
                        # A log-spaced regularisation path, 13 points over three
                        # decades, selected by nested CV inside each LOTO fold.
                        # A fixed penalty is a free parameter: on this benchmark
                        # 0.01 is the grid maximum for the marginal cases, so
                        # fixing it flatters the result.
                        #
                        # Upper bound is 0.1, not higher: beyond that Lasso zeroes
                        # every coefficient and _fit_lasso substitutes marginal
                        # correlations -- a different estimator. Including such a
                        # point would let selection pick a degenerate model.
                        # MUST stay ascending: _select_lambda's one-SE rule takes
                        # the largest qualifying penalty by index.
  steps: 1200           # 'pearson' solver only; ignored by lasso. 1200 is where
                        # held-out r stops drifting. At 600 it is NOT converged.
  lr: 0.05              # 'pearson' solver only
  n_restarts: 5         # 'pearson' solver only: the objective is non-convex, so
                        # keep the best of 5 inits by TRAINING objective.

reliability:
  n_splits: 50          # split_half_reliability

nulls:
  n_random_trials: 200   # null_random_features and null_shuffled_target
  n_bootstrap: 100      # bootstrap_r
